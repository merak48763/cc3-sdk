%YAML 1.1
---

enchantment.cc3.tax_evasion: Penalty Evasion

text.cc3.config.difficulty.easy.info: |-
  Mobs deal less damage.
  Some mechanisms may be more forgiving.
text.cc3.config.difficulty.normal.info: The intended difficulty.
text.cc3.config.difficulty.hard.info: |-
  Mobs deal more damage.
  Some mechanisms may be harsher.
text.cc3.config.death_tax: Death Penalty
text.cc3.config.death_tax.off: 'Off'
text.cc3.config.death_tax.off.info: No penalty is applied.
text.cc3.config.death_tax.mild: Mild
text.cc3.config.death_tax.mild.info: |-
  Upon death, items lose 15%% of durability.
  (The durability can only be reduced to a minimum of 1.)
  In addition, items with Curse of Vanishing are deleted.
text.cc3.config.death_tax.normal: Normal
text.cc3.config.death_tax.normal.info: |-
  Upon death, items lose 20%% of durability.
  In addition, items with Curse of Vanishing are deleted.
text.cc3.config.death_tax.challenge: Challenge!
text.cc3.config.death_tax.challenge.info: |-
  Upon death, items lose 99%% of durability.
  In addition, items with Curse of Vanishing are deleted.
text.cc3.config.death_stats_location: Death Count
text.cc3.config.death_stats_location.off: Hide
text.cc3.config.death_stats_location.sidebar: Sidebar
text.cc3.config.death_stats_location.list: Player List
text.cc3.config.reset: Reset

text.cc3.teleporter.title: Teleport
text.cc3.teleporter.info: Select the location to teleport to.
text.cc3.teleporter.empty: No unlocked teleporters.

text.cc3.stats.deaths: Deaths
text.cc3.stats.mob_kills: Mobs Killed
text.cc3.stats.spawner: Spawners Broken
text.cc3.stats.time: Time Played
text.cc3.stats.torch: Torches Placed
text.cc3.stats.totems: Totems Used
text.cc3.share_stats: Share to chat
text.cc3.shared_stats.title: Statistics of %s
# 1: stat name
# 2: stat name (invert)
# 3: stat value
# 4: stat value (invert)
# 5: stat name begin offset
# 6: stat name end offset
# 7: stat value begin offset
# 8: stat value end offset
# 9: big filler to make dialog body actually wide because 0 width causes bugs
fmt.cc3.stats_entry: '%9$s%5$s%2$s%1$s%6$s%7$s%3$s%4$s%8$s%9$s'

text.cc3.time_unit.0: s
text.cc3.time_unit.1: min
text.cc3.time_unit.2: h
text.cc3.time_unit.3: d
text.cc3.time_unit.4: 'y'
fmt.cc3.time_with_unit: '%s %s'

text.cc3.death_tax_exempt.boss: You were not affected by death penalty because you died in a boss fight.
