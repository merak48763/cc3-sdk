data_pack:
  name: cc3-sdk
  description: Cartocraft III Core Data Pack
  min_format: 121
  max_format: 121
  load:
    - dependencies/al-core.zip
    - dependencies/al-cat.zip
    - dependencies/al-dialog.zip
