data_pack:
  name: cc3-sdk
  description: Cartocraft III Core Data Pack
  min_format: 121
  max_format: 121
  load:
    - dependencies/al-core.zip
    - dependencies/al-cat.zip
    - dependencies/al-dialog.zip
    - dependencies/al-fwb.zip
    - src
  filter:
    block:
      - namespace: ^minecraft$
        path: ^advancement/(?!recipes/).*
      - namespace: ^minecraft$
        path: ^recipe/repair_item\.json$
      - namespace: ^minecraft$
        path: ^recipe/name_tag\.json$
      - namespace: ^minecraft$
        path: ^advancement/recipes/tools/name_tag\.json$
      - namespace: ^minecraft$
        path: ^recipe/ender_chest\.json$
      - namespace: ^minecraft$
        path: ^advancement/recipes/decorations/ender_chest\.json$

resource_pack:
  name: cc3-sdk
  description: Cartocraft III Test Resource Pack
  min_format: [97, 1]
  max_format: 97
  load:
    - src

require:
  - beet.contrib.auto_yaml
  - beet_scripts.unknown_files

pipeline:
  - beet_scripts.negative_spaces
